name: release-pr-benchmark-report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-report:
    if: startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - name: Generate candidate benchmark artifact
        run: ./scripts/benchmark_record.sh /tmp/release-pr-candidate.json
      - name: Compare against release baseline
        run: ./scripts/benchmark_compare.sh benchmarks/release-baseline.json /tmp/release-pr-candidate.json > /tmp/release-pr-benchmark-compare.txt
      - name: Upsert PR benchmark comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/release-pr-benchmark-compare.txt', 'utf8');
            const marker = '<!-- rustcode-release-benchmark-report -->';
            const content = `${marker}
            ### Release Benchmark Drift
            \`\`\`text
            ${body.trim()}
            \`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: content,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: content,
              });
            }
