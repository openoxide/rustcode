name: release-candidate-bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version (e.g. 0.1.0-rc1)"
        required: true
        type: string
      output_dir:
        description: "Output directory for bundle artifacts"
        required: false
        type: string
        default: "dist"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
      - name: Verify workspace via CI matrix
        run: ./scripts/ci_matrix.sh
      - name: Refresh benchmark artifact
        run: ./scripts/benchmark_record.sh benchmarks/latest.json
      - name: Build release candidate bundle
        run: ./scripts/build_release_bundle.sh "${{ github.event.inputs.version }}" "${{ github.event.inputs.output_dir }}"
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustcode-release-candidate-${{ github.event.inputs.version }}
          path: |
            ${{ github.event.inputs.output_dir }}/*.tar.gz
            ${{ github.event.inputs.output_dir }}/*.sha256
