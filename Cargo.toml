[workspace]
members = [
  "crates/rustcode",
  "crates/rustcode-core",
  "crates/rustcode-engine",
  "crates/rustcode-config",
  "crates/rustcode-auth",
  "crates/rustcode-state",
  "crates/rustcode-io",
  "crates/rustcode-plugins",
  "crates/rustcode-llm",
  "crates/rustcode-tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = "0.7"
toml = "0.9"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
futures-util = "0.3"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
rpassword = "7.4"
globset = "0.4"
regex = "1.11"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
