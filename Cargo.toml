[workspace]
members = [
  "crates/rustcode",
  "crates/rustcode-core",
  "crates/rustcode-engine",
  "crates/rustcode-config",
  "crates/rustcode-auth",
  "crates/rustcode-error",
  "crates/rustcode-logging",
  "crates/rustcode-mcp",
  "crates/rustcode-state",
  "crates/rustcode-io",
  "crates/rustcode-plugins",
  "crates/rustcode-llm",
  "crates/rustcode-skills",
  "crates/rustcode-memories",
  "crates/rustcode-tui",
  "crates/rustcode-lsp",
  "crates/rustcode-watcher",
  "crates/rustcode-snapshot",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "io-util", "fs", "net"] }
tokio-util = "0.7"
toml = "0.9"
toml_edit = "0.22"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "registry"] }
tracing-opentelemetry = "0.32"
opentelemetry = { version = "0.31", features = ["trace", "logs"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "reqwest-client", "logs", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "logs"] }
opentelemetry-appender-tracing = "0.31"
futures-util = "0.3"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
rpassword = "7.4"
globset = "0.4"
portable-pty = "0.8"
regex = "1.11"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
rustcode-skills = { path = "crates/rustcode-skills" }
rustcode-memories = { path = "crates/rustcode-memories" }
rustcode-lsp = { path = "crates/rustcode-lsp" }
rustcode-watcher = { path = "crates/rustcode-watcher" }
rustcode-snapshot = { path = "crates/rustcode-snapshot" }
notify = "6.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# ── Targeted pedantic relaxations ──
# These generate bulk noise without improving code quality in our codebase.
too_many_lines = "allow"            # Existing large functions; splitting would reduce readability
missing_errors_doc = "allow"        # Most Result functions have obvious error semantics
cast_possible_truncation = "allow"  # Deliberate numeric conversions (timestamps, sizes)
cast_possible_wrap = "allow"        # Deliberate u64→i64 for timestamps
cast_sign_loss = "allow"            # Deliberate unsigned→signed conversions
cast_precision_loss = "allow"       # u64→f64 for percentages/ratios
similar_names = "allow"             # False positives on similar variable names
module_name_repetitions = "allow"   # Module-prefixed type names are idiomatic
assigning_clones = "allow"          # clone_into vs clone — minimal real impact
struct_excessive_bools = "allow"    # Config/options structs legitimately have many bools
large_enum_variant = "allow"        # Event/Command enums intentionally have large variants
needless_pass_by_value = "allow"    # String args commonly consumed by format!/push
match_same_arms = "allow"           # Explicit match arms can improve readability
unnecessary_wraps = "allow"         # Some Result returns are for API consistency
redundant_closure_for_method_calls = "allow" # Closures can be clearer than method refs
format_push_string = "allow"        # format!() push to String is readable
no_effect_underscore_binding = "allow" # Common in test/placeholder patterns
unused_async = "allow"              # Async fn signatures for trait/API consistency
default_trait_access = "allow"      # Type::default() vs Default::default() — style choice

[workspace.lints.rust]
unsafe_code = "forbid"
